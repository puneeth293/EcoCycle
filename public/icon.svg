<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="recynova-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063B32" />
      <stop offset="100%" stop-color="#03251F" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10B981" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)" />
  
  <!-- Outer subtle ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#10B981" stroke-width="6" stroke-dasharray="16 12" opacity="0.4" />
  <circle cx="256" cy="256" r="185" fill="#044339" opacity="0.6" />

  <!-- Center Recycling Arrows & Leaf -->
  <g transform="translate(256, 256) scale(1.15)" filter="url(#glow)">
    <!-- Arrow 1 (Top) -->
    <path d="M -50 -105 L 10 -105 C 55 -105 92 -70 95 -25 L 115 -35 L 105 15 L 55 5 L 75 -5 C 72 -35 45 -65 10 -65 L -50 -65 L -35 -85 Z" fill="#34D399" />
    
    <!-- Arrow 2 (Bottom Right) -->
    <path d="M 90 20 L 60 72 C 38 110 -5 130 -50 120 L -45 142 L -90 115 L -65 70 L -60 92 C -25 100 10 85 30 55 L 58 5 L 72 25 Z" fill="#10B981" />

    <!-- Arrow 3 (Bottom Left) -->
    <path d="M -75 25 L -45 -27 C -22 -65 -60 -100 -5 -110" fill="none" />
    <path d="M -40 85 L -70 33 C -92 -5 -80 -52 -45 -80 L -62 -92 L -15 -95 L -20 -48 L -38 -60 C -60 -40 -70 -5 -50 28 L -20 80 Z" fill="#059669" />
    
    <!-- Central Sprout / Leaf Motif -->
    <path d="M 0 30 C -25 0 -20 -35 0 -55 C 20 -35 25 0 0 30 Z" fill="#6EE7B7" />
    <path d="M 0 30 L 0 -50" stroke="#064E3B" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <text x="256" y="445" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#A7F3D0">RECYNOVA</text>
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" letter-spacing="3" fill="#6EE7B7" opacity="0.85">ECO SYSTEM</text>
</svg>
